[package]
name = "agentboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "agentboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
similar = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
futures-util = "0.3"
tokio-util = "0.7"
base64 = "0.22"
# Secure secret storage: API keys live in the OS credential store (Windows
# Credential Manager), never in SQLite/logs. windows-native avoids extra deps.
keyring = { version = "3", features = ["windows-native"] }
# Sync client (A3): pinned-TLS WebSocket to the sync server.
# rustls pinned to the `ring` provider to match reqwest's provider in the lockfile
# and avoid pulling the aws-lc-rs C/asm toolchain on Windows.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
