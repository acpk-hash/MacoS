server {
    listen 443 ssl;
    server_name 192.210.231.152;

    # Use the same self-signed cert as the sync server
    ssl_certificate     /etc/iris-sync/cert.pem;
    ssl_certificate_key /etc/iris-sync/key.pem;

    root /var/www/iris-companion;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the sync server
    location /api/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket to the sync server
    location /ws {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name 192.210.231.152;
    return 301 https://$host$request_uri;
}
