map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name 192.210.231.152;

    ssl_certificate     /etc/iris-sync/cert.pem;
    ssl_certificate_key /etc/iris-sync/key.pem;

    # ── Landing page (static, single file) ─────────────────────────────
    root /var/www/iris-landing;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        root /var/www/iris-landing;
    }

    location /favicon.svg {
        root /var/www/iris-landing;
    }

    # ── Downloads (installer + APK + SHA256) ───────────────────────────
    location /downloads/ {
        alias /var/www/iris-downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # ── Companion PWA (SPA at /app/) ───────────────────────────────────
    location /app/ {
        alias /var/www/iris-companion/;
        try_files $uri $uri/ /app/index.html;
    }

    location /app/assets/ {
        alias /var/www/iris-companion/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy API to sync server ───────────────────────────────────────
    location /api/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Proxy WebSocket to sync server ─────────────────────────────────
    location /ws {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── Feishu / WeCom webhook proxy ───────────────────────────────────
    location /webhook/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTP: webhook on port 80 (Feishu requires plain HTTP), else redirect to HTTPS
server {
    listen 80;
    server_name 192.210.231.152;

    location /webhook/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
