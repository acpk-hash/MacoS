name: Build Iris Remote Mobile

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build PWA
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             Iris-Remote-0.14.0-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-Remote-0.14.0-android
          path: companion/Iris-Remote-0.14.0-android.apk

  ios:
    name: iOS App
    runs-on: macos-14
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build PWA
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build iOS app (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Iris.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          cd ios/App/build/Iris.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R App.app Payload/
          cd ..
          zip -r Iris-Remote-0.14.0-ios.ipa Applications/Payload
          mv Iris-Remote-0.14.0-ios.ipa ../../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-Remote-0.14.0-ios
          path: companion/ios/App/Iris-Remote-0.14.0-ios.ipa
